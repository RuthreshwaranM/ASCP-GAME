<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Akasa Sky Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-wrap">
    <canvas id="game" width="400" height="640"></canvas>

    <!-- Live score while playing -->
    <div id="score">0</div>

    <!-- Start screen -->
    <div id="menu" class="overlay">
      <h1>Akasa Sky Run</h1>
      <p>Tap, click or press Space to climb.<br>Keep clear of the buildings.</p>
      <div class="pilot">Pilot: <b id="pilotName">-</b>
        <button id="editNameBtn" class="small-btn">Edit name</button></div>
      <button id="playBtn">Play</button>
      <button id="boardBtn" class="ghost-btn">Leaderboard</button>
      <small>Best: <span id="bestMenu">0</span></small>
    </div>

    <!-- Game over screen -->
    <div id="gameover" class="overlay hidden">
      <img id="overImg" alt="" style="display:none">
      <h2>Landed hard</h2>
      <div class="result">
        <div><span>Score</span><b id="finalScore">0</b></div>
        <div><span>Coins</span><b id="finalCoins">0</b></div>
        <div><span>Best</span><b id="bestScore">0</b></div>
      </div>
      <div id="rankLine" class="rankLine"></div>
      <div id="topLine" class="topLine"></div>
      <button id="retryBtn">Fly again</button>
      <button id="boardBtn2" class="ghost-btn">Leaderboard</button>
    </div>

    <!-- Name box (first time, and when editing) -->
    <div id="nameBox" class="overlay hidden">
      <h2>Enter your pilot name</h2>
      <p>This name shows on the leaderboard.<br>You can change it later.</p>
      <input id="nameInput" type="text" maxlength="20" placeholder="Your name" autocomplete="off">
      <div id="nameErr" class="err"></div>
      <button id="nameSave">Save</button>
      <button id="nameCancel" class="ghost-btn">Cancel</button>
    </div>

    <!-- Leaderboard -->
    <div id="board" class="overlay hidden">
      <h2>Leaderboard</h2>
      <div id="boardList"></div>
      <button id="boardClose">Close</button>
    </div>
  </div>

  <script src="leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
